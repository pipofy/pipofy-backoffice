@if (facade.loading()) {
  <app-placeholder tone="loading" size="page" title="Cargando panel…" />
} @else if (facade.error()) {
  <app-placeholder tone="error" size="page" title="No se pudo cargar el panel" [body]="errorText()" />
} @else if (facade.data(); as snap) {
  <section id="view-dashboard">
    <app-kpi-row [kpis]="snap.kpis" />

    <div class="ops">
      <div>
        <div class="section-head">
          <h2>Grilla de canchas</h2>
        </div>
        <app-court-grid [grid]="snap.grid" />
      </div>

      <div class="rail">
        <app-waitlist-card [entries]="snap.waitlist" />
      </div>
    </div>
  </section>
}
